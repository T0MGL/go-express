name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.goexpressparaguay.com/api
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://goexpressparaguay.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-express-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: go-express-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # La suite usa PostgREST y valida JWT contra GoTrue, asi que necesita el stack
      # completo y no un Postgres pelado.
      - name: Levantar stack Supabase local
        run: supabase start

      - name: Exportar credenciales del stack local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "TEST_DATABASE_URL=$DB_URL"
            echo "TEST_SUPABASE_URL=$API_URL"
            echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Schema, migraciones y seed
        run: bash scripts/test-db-reset.sh

      # run-tests.mjs saltea la suite entera si DATABASE_URL apunta a prod y no hay
      # TEST_DATABASE_URL. Eso dejaba el job en verde sin ejecutar un solo test, asi que
      # el skip se trata como fallo.
      - name: Test
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.log
          if grep -q 'Tests skipped' test-output.log; then
            echo '::error::La suite se salteo. El job no puede pasar en verde sin ejecutar tests.'
            exit 1
          fi
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          CORS_ORIGINS: http://localhost:3000,http://localhost:8080
          PORT: 3001
          TRACKING_PREFIX: GE
          TRACKING_YEAR: 2026
          EMAIL_FROM: "GoExpress <envios@goexpressparaguay.com>"
